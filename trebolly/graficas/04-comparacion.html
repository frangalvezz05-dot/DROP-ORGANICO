<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Comparación</title>
<style>@import url('_base.css');
body{padding:120px 140px;justify-content:center}
h1{font-size:136px}
.foto{position:relative;width:820px;height:820px;border-radius:24px;overflow:hidden;margin:70px 0 70px;border:2px solid var(--borde);background:var(--niebla)}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hueco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:44px;color:var(--gris)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:64px}
th,td{padding:34px 34px;text-align:center}
th{font-size:50px;font-weight:700;color:var(--gris)}
th.n{background:var(--agua);border-radius:24px 24px 0 0;color:#fff;font-size:56px;font-weight:800}
th.n img{height:76px;display:block;margin:0 auto}
td:first-child{text-align:left;font-weight:700}
td.o{color:#8C9497;font-weight:500}
td.n{background:#fff;font-weight:800;border-left:3px solid var(--agua);border-right:3px solid var(--agua)}
tr:last-child td.n{border-radius:0 0 24px 24px;border-bottom:3px solid var(--agua)}
td.grande{font-size:110px;color:var(--agua);line-height:1}
</style></head><body>
<h1>Mismo precio.<br><span>5 veces más filtros.</span></h1>
<div class="foto"><div class="hueco">Foto J (pack de 2)<br>guardar como 02-pack2-v2.jpg</div><img src="../02-pack2-v2.jpg" alt="" onerror="this.remove()"></div>
<table>
<tr><th></th><th>Otro pack de 2</th><th class="n"><img src="../logo-trebolly-blanco.png" alt="trebolly" onerror="this.outerHTML='trebolly'"></th></tr>
<tr><td>Precio</td><td class="o">59,95 €</td><td class="n">59,95 €</td></tr>
<tr><td>Filtros de recambio</td><td class="o">2</td><td class="n grande">10</td></tr>
</table>
</body></html>
