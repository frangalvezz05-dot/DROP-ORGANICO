<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Comparación</title>
<style>@import url('_base.css');
body{padding:120px 140px}
h1{font-size:136px}
.foto{width:720px;height:720px;border-radius:24px;overflow:hidden;margin:70px 0 64px;border:2px solid var(--borde)}
.foto img{width:100%;height:100%;object-fit:cover}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:58px}
th,td{padding:28px 34px;text-align:center}
th{font-size:48px;font-weight:700;color:var(--gris)}
th.n{color:#fff;background:var(--agua);border-radius:24px 24px 0 0;font-size:56px;font-weight:800;letter-spacing:.5px}
td:first-child{text-align:left;font-weight:700}
td.o{color:#8C9497;font-weight:500}
td.n{background:#fff;font-weight:800;border-left:3px solid var(--agua);border-right:3px solid var(--agua)}
tr:last-child td.n{border-radius:0 0 24px 24px;border-bottom:3px solid var(--agua)}
td.grande{font-size:96px;color:var(--agua);line-height:1}
.check{color:var(--trebol);font-size:72px}
</style></head><body>
<h1>Mismo precio.<br><span>5 veces más filtros.</span></h1>
<div class="foto"><img src="../02-pack2-v2.jpg" alt=""></div>
<table>
<tr><th></th><th>Otro pack de 2</th><th class="n">trebolly</th></tr>
<tr><td>Precio</td><td class="o">59,95 €</td><td class="n">59,95 €</td></tr>
<tr><td>Filtros de recambio</td><td class="o">2</td><td class="n grande">10</td></tr>
<tr><td>Cepillo de masaje</td><td class="o">—</td><td class="n"><span class="check">✓</span></td></tr>
</table>
</body></html>
