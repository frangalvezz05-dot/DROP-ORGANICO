<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Anuncio tinte 4x5</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Fraunces:opsz,wght@9..144,600&display=swap');
:root{--porcelana:#FAFAF7;--niebla:#EEF3F2;--grafito:#22282B;--gris:#5E676B;--agua:#1F7A8C}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--niebla);font-family:'Bricolage Grotesque',sans-serif;color:var(--grafito)}
.foto,.hueco{position:absolute;inset:0}
.foto{width:100%;height:100%;object-fit:cover}
.hueco{display:flex;align-items:center;justify-content:center;text-align:center;padding:80px;font-size:34px;color:var(--gris);line-height:1.35}
.gancho{position:absolute;left:60px;right:60px;top:90px;background:rgba(250,250,247,.94);border-radius:28px;padding:44px 48px}
.gancho h1{font-family:'Fraunces',serif;font-weight:600;font-size:64px;line-height:1.08;letter-spacing:-.5px}
.gancho h1 span{color:var(--agua);display:block;margin-top:10px}
.gancho p{margin-top:18px;font-size:30px;color:var(--gris);font-weight:500}
.marca{position:absolute;left:60px;bottom:60px;background:rgba(250,250,247,.94);border-radius:999px;padding:14px 30px;font-weight:700;font-size:34px;color:var(--agua)}
.marca img{height:40px;display:block}
</style></head><body>
<div class="hueco">Foto: mechas con el cepillo (H)<br>guardar como anuncio-tinte.jpg</div>
<img class="foto" src="anuncio-tinte.jpg" alt="" onerror="this.remove()">
<div class="gancho"><h1>90 € de mechas…<br>y a las tres semanas, apagadas.<span>Mira el agua.</span></h1><p>Cabezal de ducha con filtro en el mango</p></div>
<div class="marca"><img src="../logo-trebolly.png" alt="trebolly" onerror="this.outerHTML='trebolly'"></div>
</body></html>
